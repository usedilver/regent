name: Regent
# bypass (default): el agente usa todas las herramientas y MCPs del repo; los hooks
# de regent filtran secretos y readonly_mcp, pero no son un sandbox de seguridad.
# native: respeta allow/ask/deny del repo; en headless lo no permitido se auto-deniega.
permission_mode: bypass
auth:
  # Pro/Max personal via Claude Code. Compartir la cuenta puede causar suspension/baneo.
  mode: indie
repos:
  path: /absolute/path/to/repos
  workspace_root: null
  default_repo: null # Relativo al workspace; null usa el workspace como contexto inicial.
  agent_env_files: []
  readonly_mcp: []
slack:
  workspace_team_id: T_REPLACE
  allowed_users: [U_REPLACE] # Solo tu usuario; obligatorio en indie, nunca una lista vacia.
limits:
  max_concurrent_runs: 3
  max_run_sec: { ask: 600, patch: 1800, task: 3600 }
  stall_sec: 300
  cancel_grace_sec: 60
budget:
  max_cost_usd_per_run: 8
  max_cost_usd_per_user_day: 25
session:
  idle_reset_hours: 24
models:
  ask: null
  patch: null
  task: null
